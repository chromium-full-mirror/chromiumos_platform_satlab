<div class="wrapper">
  <app-build-select-form (allRequiredFieldsSet)="allRequiredFieldsSet($event)"></app-build-select-form>

  <div class="px-6">
    <app-autocomplete-selector
      #suiteSelector
      id="suiteSelector"
      title="Please select a suite or input a custom suite name:"
      placeholder="Please select a suite or input a custom suite name" (inputChanged)="onSuiteChanged($event)"
      [options]="suiteOptions">
    </app-autocomplete-selector>
  </div>

  <div class="flex justify-center py-4">
    <button mat-raised-button color="primary" (click)="onRunSuiteClick()" [disabled]="disabled">Run Suite</button>
  </div>
</div>
