<div class="truncate max-w-full" [attr.title]="cellValue()">
  <ng-container *ngIf="isLink && cellValue(); else textOnly">
    <a
      [href]="cellValue()"
      target="_blank"
      class="text-blue-600 hover:underline"
    >
      <span class="material-icons">link</span>
    </a>
  </ng-container>
  <ng-template #textOnly>
    <span>{{ cellValue() }}</span>
  </ng-template>
</div>
