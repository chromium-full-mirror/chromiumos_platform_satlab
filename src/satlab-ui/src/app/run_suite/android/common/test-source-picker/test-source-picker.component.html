<div
  class="flex w-full mb-8 border border-gray-300 rounded-md overflow-hidden"
  *ngIf="!_isTestplan()"
>
  <div #sourceType class="flex w-full">
    <button
      type="button"
      (click)="onModeChanged('ANDROID_BUILD')"
      [class]="
        isAndroidBuild()
          ? 'flex-1 py-3 px-4 bg-blue-500 text-white font-semibold transition-colors disabled:opacity-50 disabled:cursor-not-allowed'
          : 'flex-1 py-3 px-4 bg-white text-gray-600 font-medium hover:bg-gray-50 transition-colors disabled:opacity-50 disabled:cursor-not-allowed'
      "
      [disabled]="isDisabled()"
    >
      Android Build
    </button>
    <div class="w-[1px] bg-gray-300"></div>
    <button
      type="button"
      (click)="onModeChanged('GOOGLE_DRIVE')"
      [class]="
        isGoogleDrive()
          ? 'flex-1 py-3 px-4 bg-blue-500 text-white font-semibold transition-colors disabled:opacity-50 disabled:cursor-not-allowed'
          : 'flex-1 py-3 px-4 bg-white text-gray-600 font-medium hover:bg-gray-50 transition-colors disabled:opacity-50 disabled:cursor-not-allowed'
      "
      [disabled]="isDisabled()"
    >
      Google Drive
    </button>
  </div>
</div>

<app-android-build-picker
  [hidden]="isGoogleDrive()"
  [active]="isAndroidBuild()"
  [duts]="duts"
  [board]="board"
  [model]="model"
  [type]="'test'"
  [parentLoading]="parentLoadingSignal()"
  (errorsChanged)="testPickerErrors.set($event)"
  (isLoadingChanged)="onLoadingWithMsg($event)"
  (valuesChanged)="onAndroidBuildValuesChanged($event)"
>
</app-android-build-picker>

<div #drivePickerComponent [hidden]="isAndroidBuild()">
  <app-basic-selector
    title="Select Suite:"
    [options]="driveSuiteOptions"
    (select)="onDriveSuiteSelectedChanged($event)"
    [disabled]="isDriveDisabled()"
  ></app-basic-selector>

  <app-autocomplete
    title="Select xTS zip file:"
    [options]="driveXtsPathOptions()"
    [value]="driveXtsPathSignal()"
    [strict]="true"
    (selectChanged)="onDriveXtsPathChanged($event)"
    (inputChanged)="onDriveXtsPathChanged($event)"
    [disabled]="isDriveDisabled()"
  ></app-autocomplete>
</div>
