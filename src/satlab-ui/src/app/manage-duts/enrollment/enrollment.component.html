<div class="wrapper">
  <div class="btn-group">
    <button
      mat-raised-button
      color="primary"
      [disabled]="!isDUTSelected || loading"
      (click)="onEnrollClicked()"
    >
      Enroll Selected
    </button>

    <button
      mat-raised-button
      [disabled]="!isDUTSelected || loading"
      (click)="onUnEnrollClicked()"
    >
      Unenroll Selected
    </button>

    <button
      mat-raised-button
      [disabled]="!isDUTSelected || loading"
      (click)="onRepairClicked()"
    >
      Repair
    </button>

    <button
      mat-raised-button
      [disabled]="loading || !isProvisionable()"
      (click)="onProvisionDUTs()"
    >
      Provision DUTs
    </button>

    <div class="relative w-48">
      <button
        class="w-full"
        mat-raised-button
        [disabled]="loading || !isDUTSelected"
        (click)="onSetOSRestrictionClicked()"
      >
        <div class="flex justify-between items-center flex-row">
          <span>Set OS Restriction</span>
          <span class="material-symbols-outlined material-icon-base"
            >arrow_drop_down</span
          >
        </div>
      </button>

      <div
        class="absolute top-12 right-0 h-0 flex flex-col gap-y-3 text-left rounded shadow z-10 w-full bg-white overflow-hidden"
        [class.h-fit]="restrictionDropdown()"
      >
        <a
          class="cursor-pointer px-4 pt-4 whitespace-nowrap"
          (click)="onUpdateOSRestrictionClicked('ANDROID_ONLY')"
          >Android only</a
        >
        <a
          class="cursor-pointer px-4 whitespace-nowrap"
          (click)="onUpdateOSRestrictionClicked('CHROMEOS_ONLY')"
          >ChromeOS only</a
        >
        <a
          class="cursor-pointer px-4 pb-4 whitespace-nowrap"
          (click)="onUpdateOSRestrictionClicked('ANY')"
          >Any</a
        >
      </div>
    </div>
  </div>

  <br />

  <div class="pool-wrapper">
    <div class="input-wrapper">
      <div class="inputbox-container without-border w-48">
        <b>Pool: </b>
        <mat-form-field class="without-underline full-width">
          <input id="pool" matInput [formControl]="pool" />
        </mat-form-field>
      </div>

      <button
        mat-raised-button
        color="primary"
        [disabled]="
          !(pool.value !== '' && isDUTSelected) ||
          loading ||
          (pool.invalid && (pool.dirty || pool.touched))
        "
        (click)="onAddPoolClicked()"
      >
        Add
      </button>

      <button
        mat-raised-button
        color="primary"
        [disabled]="
          !(pool.value !== '' && isDUTSelected) ||
          loading ||
          (pool.invalid && (pool.dirty || pool.touched))
        "
        (click)="onRemovePoolClicked()"
      >
        Remove
      </button>
    </div>
    <ng-container *ngIf="pool.invalid && (pool.dirty || pool.touched)">
      <div class="error">
        Must be less than 20 characters and contains letters, 0-9, or '-'
      </div>
    </ng-container>
  </div>

  <div class="function-tools-wrapper">
    <mat-slide-toggle
      (change)="autoRefreshChanged($event)"
      [(ngModel)]="autoRefreshFlag"
      >Auto refresh
    </mat-slide-toggle>
  </div>

  <app-view-duts
    [DUTs]="DUTs"
    (selectDUTs)="onDUTsSelectionChanged($event)"
    [loading]="loading"
    [hostnamePrefix]="hostnamePrefix"
  ></app-view-duts>
</div>
