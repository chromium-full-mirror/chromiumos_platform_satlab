<!-- View Auto-Qual test effort history -->
<div [class.hidden]="isScheduleRun()">
  <div class="flex items-baseline justify-between mx-4 mt-14 mb-4">
    <div class="flex flex-row items-baseline gap-2 pointer-events-auto">
      <p class="text-xl font-bold text-gray-800">Test Effort History</p>
      <button class="font-semibold" (click)="onReloadTestRecordsClicked()">
        <span class="material-icon">refresh</span>
      </button>
    </div>
    <button
      class="bg-blue-500 hover:bg-blue-600 active:bg-blue-700 shadow-md active:shadow-sm text-white font-semibold py-2 px-4 rounded transition-colors"
      routerLink="schedule"
    >
      Schedule Run
    </button>
  </div>

  <div
    class="max-w-full mx-4 my-8 bg-white rounded-xl shadow-md border border-gray-100 overflow-hidden"
  >
    <div
      class="relative max-h-[640px] min-h-[640px] overflow-y-auto overflow-x-auto"
      (scroll)="onScroll($event)"
    >
      <div
        *ngIf="isViewTestEffotLoading().show"
        class="sticky top-0 left-0 w-full h-[640px] z-[2] flex items-center justify-center pointer-events-none bg-white/50 mb-[-640px]"
      >
        <mat-spinner diameter="96"></mat-spinner>
      </div>
      <table class="w-full text-left border-separate border-spacing-0">
        <thead>
          <tr
            class="bg-gray-100 text-sm font-bold text-gray-700 tracking-wider"
          >
            <!-- Toggle Column Visibility Menu -->
            <th
              class="sticky top-0 z-[2] bg-gray-100 bg-clip-padding p-3 rounded-tl-lg border-l border-t border-b border-gray-200 w-12 text-center"
            >
              <button
                class="material-icon material-icon-base hover:bg-gray-200 p-1 rounded transition-colors"
                (click)="toggleMenu()"
              >
                <span class="material-icons text-gray-600">list</span>
              </button>
              <div
                *ngIf="isMenuOpen()"
                class="absolute top-full left-0 mt-2 z-[4] w-56 p-3 bg-white border border-gray-200 rounded-lg shadow-2xl normal-case font-normal text-left"
              >
                <div class="flex flex-col gap-1">
                  <label
                    *ngFor="let field of ALL_COLUMNS"
                    class="flex items-center hover:bg-gray-50 p-2 rounded cursor-pointer transition-colors"
                  >
                    <input
                      type="checkbox"
                      class="rounded text-blue-600 mr-3 peer"
                      [checked]="displayedColumns().includes(field)"
                      [disabled]="
                        displayedColumns().includes(field) &&
                        displayedColumns().length === 1
                      "
                      (click)="onColumnClicked(field)"
                    />
                    <span
                      class="text-sm text-gray-700 font-medium peer-disabled:text-gray-300"
                      >{{ COLUMN_NAME_MAP[field] ?? field }}</span
                    >
                  </label>
                </div>
              </div>
            </th>

            <!-- Column Headers -->
            <th
              *ngFor="
                let column of displayedColumns();
                let last = last;
                trackBy: trackByCol
              "
              [class.border-r]="last"
              class="sticky top-0 z-[2] bg-gray-100 bg-clip-padding p-2 text-sm border-t border-b border-gray-200 font-bold text-gray-700 tracking-wider"
            >
              {{ COLUMN_NAME_MAP[column] ?? column }}
            </th>
          </tr>
        </thead>
        <tbody class="bg-white">
          <tr
            *ngFor="let record of testRecords(); trackBy: trackById"
            class="hover:bg-blue-50/30 transition-colors"
          >
            <td class="p-3 w-12 border-gray-200"></td>

            <td
              *ngFor="let col of displayedColumns(); trackBy: trackByCol"
              class="p-2 border-gray-200 min-w-[100px] max-w-[200px] truncate font-mono"
              [app-table-cell]
              [cell]="record[col]"
            ></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Schedule a new Auto-Qual test effort -->
<div [class.hidden]="!isScheduleRun()">
  <div class="w-full lg:max-w-3xl mx-auto px-6 my-[4rem]">
    <div class="flex flex-row items-normal gap-2 my-4">
      <button
        class="bg-transparent text-black hover:text-gray-400 text-lg rounded transition-colors"
        routerLink="/run_tests/android/autoqual"
      >
        <span class="material-icon font-bold">arrow_back</span>
      </button>
      <p class="text-xl font-bold text-gray-800">Schedule Test Effort</p>
    </div>
    <p class="w-full my-4 text-gray-400">
      A test effort is a combination of a test plan with set requirements, and
      will automatically re-run failed tests until criteria are met.
    </p>
    <div class="relative w-full px-6 pt-0 pb-6 border box-shadow rounded">
      <app-loading [loading$]="scheduleRunloading$"></app-loading>
      <div class="min-h-[1.5rem]">
        <p class="text-red-500 text-center">{{ notAvailableMsg() }}</p>
      </div>
      <div class="flex flex-col gap-2 w-full">
        <app-basic-selector
          (select)="onPropsChanged('board', $event)"
          [options]="boardOptions()"
          [disabled]="isScheduleRunLoading().show"
          title="Select Board:"
        >
        </app-basic-selector>

        <app-basic-selector
          (select)="onPropsChanged('model', $event)"
          [options]="modelOptions()"
          [value]="modelSignal()"
          [disabled]="
            isScheduleRunLoading().show || modelOptions().length === 0
          "
          title="Select Model:"
        >
        </app-basic-selector>

        <app-basic-selector
          (select)="onPropsChanged('branch', $event)"
          [options]="filteredBranchOptions()"
          [value]="branchSignal()"
          [disabled]="
            isScheduleRunLoading().show || filteredBranchOptions().length === 0
          "
          title="Select OS Branch:"
        >
        </app-basic-selector>

        <app-basic-selector
          (select)="onPropsChanged('boardTarget', $event)"
          [options]="boardTargetOptions()"
          [value]="boardTargetSignal()"
          [disabled]="
            isScheduleRunLoading().show || boardTargetOptions().length === 0
          "
          title="Select OS Target:"
        >
        </app-basic-selector>

        <app-autocomplete-selector
          (selectChanged)="onPropsChanged('build', $event)"
          (inputValueChanged)="onPropsChanged('build', $event)"
          [options]="buildOptions()"
          title="Select Build:"
        ></app-autocomplete-selector>

        <div class="my-2">
          <mat-slide-toggle (change)="onCrossBranchTestingChanged($event.checked)" [disabled]="isScheduleRunLoading().show">
            Use a separate test build
          </mat-slide-toggle>
        </div>

        <app-android-build-picker *ngIf="isCrossBranchSignal()" [board]="boardSignal()" [model]="modelSignal()" [type]="'test'"
          [duts]="dutsSignal()" [parentLoading]="isScheduleRunLoading().show"
          (dataChanged)="onAndroidBranchTargetBuildChanged($event)"></app-android-build-picker>

        <div *ngIf="!isCrossBranchSignal()">
          <app-basic-selector
            (select)="onPropsChanged('testTarget', $event)"
            [options]="testTargetOptions()"
            [value]="testTargetSignal()"
            [disabled]="
              isScheduleRunLoading().show || testTargetOptions().length === 0
            "
            title="Select Test Target:"
          >
          </app-basic-selector>
        </div>

        <app-basic-selector
          (select)="onPropsChanged('pool', $event)"
          [options]="poolOptions()"
          [value]="poolSignal()"
          [disabled]="isScheduleRunLoading().show || poolOptions().length === 0"
          title="Select Pool:"
        >
        </app-basic-selector>
      </div>
      <div class="relative w-full my-2">
        <input
          type="text"
          class="w-full peer block border-b border-gray-400 pb-1 pt-6 focus:border-blue-500 bg-transparent outline-none text-sm font-light font-sans"
          placeholder=""
          (input)="onTestplanValueChanged($event)"
          [value]="testplanSignal()"
        />
        <label
          class="pointer-events-none absolute top-4 origin-[0] -translate-y-3 scale-75 duration-150 text-gray-500 font-sans font-light peer-placeholder-shown:translate-y-0 peer-placeholder-shown:scale-100 peer-focus:-translate-y-3 peer-focus:scale-75 peer-focus:text-blue-500"
          >Test Plan/Suite:</label
        >
      </div>
      <app-advanced-settings (settingsChanged)="onAdvancedSettingsChanged($event)" [disabled]="isScheduleRunLoading().show"
        [customSettings]="customSettings"></app-advanced-settings>
      <div class="relative w-full py-4 flex flex-row gap-4 justify-center">
        <button
          class="w-32 bg-blue-500 hover:bg-blue-600 active:bg-blue-700 disabled:bg-gray-200 shadow-md active:shadow-sm text-white disabled:text-gray-400 font-normal py-2 px-4 rounded transition-colors cursor-pointer disabled:cursor-not-allowed"
          (click)="onScheduleClicked()"
          [disabled]="isScheduleRunLoading().show || !isRunnable()"
        >
          Schedule
        </button>
      </div>
    </div>
  </div>
</div>
