<div class="wrapper">
  <div *ngIf="type === 'firmware' || type === 'all'">
    <h3>{{ title }}</h3>
  </div>

  <app-basic-selector
    #milestoneSelector
    (select)="onMilestoneChanged($event)"
    [disabledMessage]="
      board === '' || model === '' ? 'Please select a model and board' : ''
    "
    [disabled]="
      board === '' ||
      model === '' ||
      disabled ||
      (loading | async).show ||
      (isFetchingMilestones | async)
    "
    [options]="milestoneOptions"
    [placeholder]="'Please select a milestone'"
    [title]="
      type === 'firmware' ? 'Select Firmware Milestone:' : 'Select Milestone:'
    "
    id="milestoneSelector"
    [autoSelect]="autoSelect"
    [value]="defaultValue?.milestone"
  >
  </app-basic-selector>

  <app-basic-selector
    #buildSelector
    (select)="onBuildChanged($event)"
    [disabledMessage]="
      board === '' || model === '' || (milestone$ | async) === ''
        ? 'Please select a milestone'
        : ''
    "
    [disabled]="
      board === '' ||
      model === '' ||
      (milestone$ | async) === '' ||
      disabled ||
      (loading | async).show ||
      (isFetchingBuilds | async)
    "
    [options]="buildOptions"
    [placeholder]="'Please select a build version'"
    [title]="
      type === 'firmware'
        ? 'Select Firmware Build Version:'
        : 'Select Build Version'
    "
    id="buildSelector"
    [autoSelect]="autoSelect"
    [value]="defaultValue?.build"
  >
  </app-basic-selector>
</div>
