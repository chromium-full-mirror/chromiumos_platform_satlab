<div class="notification-wrapper">
  <div
    [class.info]="notification.type === 'info'"
    [class.error]="notification.type === 'error'"
    class="content"
  >
    <p>{{ notification.message }}</p>
    <button
      *ngIf="showDismissButton"
      mat-button
      (click)="onDismissClick()"
      class="dismiss-btn"
    >
      Dismiss
    </button>
  </div>
</div>
