<div class="wrapper">
  <div class="btn-group">
    <button
      mat-raised-button
      color="primary"
      [disabled]="!isDUTSelected || loading"
      (click)="onEnrollClicked()"
    >
      Enroll Selected
    </button>

    <button
      mat-raised-button
      [disabled]="!isDUTSelected || loading"
      (click)="onUnEnrollClicked()"
    >
      Unenroll Selected
    </button>

    <button
      mat-raised-button
      [disabled]="!isDUTSelected || loading"
      (click)="onReVerifyClicked()"
    >
      Reverify Selected
    </button>

    <button
      mat-raised-button
      [disabled]="loading"
      (click)="onProvisionDUTs()"
    >
      Provision DUTs
    </button>
  </div>

  <br/>

  <div class="input-wrapper">
    <div class="inputbox-container without-border w-48">
      <b>Pool: </b>
      <mat-form-field class="without-underline full-width">
        <input id="pool" matInput [formControl]="pool"/>
      </mat-form-field>
    </div>

    <button
      mat-raised-button
      color="primary"
      [disabled]="!(pool.value !== '' && isDUTSelected) || loading"
      (click)="onAddPoolClicked()"
    >
      Add
    </button>

    <button
      mat-raised-button
      color="primary"
      [disabled]="!(pool.value !== '' && isDUTSelected) || loading"
      (click)="onRemovePoolClicked()"
    >
      Remove
    </button>
  </div>

  <app-view-duts
    [DUTs]="DUTs"
    (select)="onDUTsSelectionChanged($event)"
    [loading]="loading"
    [hostnamePrefix]="hostnamePrefix"
  ></app-view-duts>
</div>
