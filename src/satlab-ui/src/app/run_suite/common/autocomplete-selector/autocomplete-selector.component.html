<div
  class="wrapper"
  matTooltip="{{ disabledMessage }}"
  matTooltipPosition="right"
>
  <div class="selector-wrapper">
    <mat-form-field class="full-width zero-padding">
      <mat-label>{{ title }}</mat-label>
      <input
        #search
        (focusin)="onInputFocusIn()"
        (focusout)="onInputFocusout()"
        [formControl]="searchFormControl"
        [placeholder]="placeholder"
        matInput
      />
      <mat-hint *ngIf="errorMessage !== ''" class="error"
        >{{ errorMessage }}
      </mat-hint>
    </mat-form-field>
  </div>

  <ng-container *ngIf="isShown">
    <div
      (mouseenter)="onMouseEnter()"
      (mouseleave)="onMouseLeave()"
      class="items-wrapper"
    >
      <mat-list role="list">
        <mat-list-item
          (click)="onOptionClicked(option.label === 'Failed' ? null : option)"
          *ngFor="let option of filteredOptions"
          [disabled]="option.label === 'Failed'"
          class="item"
          role="listitem"
        >
          {{ option.text }}
        </mat-list-item>
      </mat-list>
    </div>
  </ng-container>
</div>
