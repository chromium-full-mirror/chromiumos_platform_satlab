<div class="settings-wrapper">
  <mat-accordion>
    <mat-expansion-panel #settings [hideToggle]="true">
      <mat-expansion-panel-header>
        <mat-panel-title> Advanced settings</mat-panel-title>
        <mat-icon *ngIf="!settings.expanded">arrow_drop_down</mat-icon>
        <mat-icon *ngIf="settings.expanded">arrow_drop_up</mat-icon>
      </mat-expansion-panel-header>
      <div class="flex flex-col gap-4">
        <div *ngIf="customSettings.hasOwnProperty('extraTestFilter')">
          <div class="flex flex-row gap-4">
            <mat-slide-toggle
              (change)="onExtraTestFilterChanged($event.checked)"
              [checked]="(settings$ | async).extraTestFilter && !disabled"
              [disabled]="disabled"
              >Extra Test Filters
            </mat-slide-toggle>
          </div>
        </div>
        <div *ngIf="customSettings.hasOwnProperty('editTopology')">
          <div class="flex flex-row gap-4">
            <mat-slide-toggle
              (change)="onEditTopologyChanged($event.checked)"
              [checked]="(settings$ | async).editTopology && !disabled"
              [disabled]="disabled"
              >Edit Topology
            </mat-slide-toggle>
          </div>
        </div>
        <div *ngIf="customSettings.hasOwnProperty('cft')">
          <div class="flex flex-row gap-4">
            <mat-slide-toggle
              (change)="onCftChanged($event.checked)"
              [checked]="(settings$ | async).cft && !disabled"
              [disabled]="disabled"
              >CFT execution framework
            </mat-slide-toggle>
          </div>
        </div>

        <div *ngIf="customSettings.hasOwnProperty('trv2')">
          <div class="flex flex-row gap-4">
            <mat-slide-toggle
              (change)="onTrv2Changed($event.checked)"
              [checked]="(settings$ | async).trv2 && !disabled"
              [disabled]="disabled"
              >Test Runner V2
            </mat-slide-toggle>
          </div>
        </div>

        <div *ngIf="customSettings.hasOwnProperty('uploadToCpcon')">
          <div class="flex flex-row gap-4">
            <mat-slide-toggle
              (change)="onUploadToCpconChanged($event.checked)"
              [checked]="(settings$ | async).uploadToCpcon && !disabled"
              [disabled]="disabled"
              >Upload to CPCON
            </mat-slide-toggle>
          </div>
        </div>
      </div>
    </mat-expansion-panel>
  </mat-accordion>
</div>
