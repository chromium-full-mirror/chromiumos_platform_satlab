<div class="wrapper">
  <ng-container *ngIf="loading">
    <div class="loading-overlay">
      <mat-spinner class="spinner"></mat-spinner>
    </div>
  </ng-container>

  <div class="selection-section" *ngIf="!loading && jobs.length > 0">
    <button (click)="columnSelectionChanged($event)">
      <span class="material-icon material-icon-base">list</span>
    </button>
  </div>

  <div
    appClickDetector
    class="column-selection-wrapper"
    [class.show]="isColumnSelectionShown"
    (outside)="closeColumnSelection($event)"
  >
    <mat-checkbox
      *ngFor="let op of columnOptions"
      [checked]="displayedColumns.includes(op.value)"
      (change)="toggleColumn($event.checked, op.value)"
      [disabled]="isOneColumnLeft && displayedColumns.includes(op.value)"
      >{{ op.text }}</mat-checkbox
    >
  </div>

  <div class="no-data-wrapper" *ngIf="jobs.length === 0 && !loading">
    No Data
  </div>

  <div
    class="jobs-wrapper"
    appInfiniteScroll
    (scrollCallback)="onTableScroll($event)"
    [class.disabled-scroll]="loading"
  >
    <ng-container *ngIf="jobs.length > 0">
      <table mat-table [dataSource]="jobs">
        <ng-container [matColumnDef]="item.def" *ngFor="let item of columns">
          <ng-container *ngIf="item.type === 'checkbox'">
            <th mat-header-cell *matHeaderCellDef>
              <mat-checkbox
                (change)="onCheckboxChanged($event)"
                [(ngModel)]="isAllSelected"
                [indeterminate]="isIndeterminate"
              ></mat-checkbox>
            </th>
            <td mat-cell *matCellDef="let element">
              <mat-checkbox
                (change)="onJobCheckboxChanged(element)"
                [checked]="selection.isSelected(element)"
                [disabled]="!selectableStatuses.includes(element.status)"
              ></mat-checkbox>
            </td>
          </ng-container>

          <th mat-header-cell *matHeaderCellDef>{{ item.header }}</th>

          <ng-container *ngIf="item.type === 'string'">
            <td mat-cell *matCellDef="let element">
              <span>{{ element[item.def] }}</span>
              <span
                *ngIf="item.def === 'name' && element.autoQual"
                class="inline-block ml-2 px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-100 text-blue-800"
                >AutoQual</span
              >
            </td>
          </ng-container>

          <ng-container *ngIf="item.type === 'date'">
            <td mat-cell *matCellDef="let element">
              {{ element[item.def] | date: 'yyyy/MM/dd HH:mm:ss z' }}
            </td>
          </ng-container>

          <ng-container *ngIf="item.type === 'link'">
            <td mat-cell *matCellDef="let element">
              <div class="links">
                <ng-container *ngFor="let link of item.actions">
                  <ng-container *ngIf="link.getLink(element) !== ''">
                    <a
                      target="_blank"
                      href="{{ link.getLink(element) }}"
                      matTooltip="{{ link.tooltip }}"
                    >
                      <ng-container *ngIf="link.icon">
                        <span class="material-icon material-icon-base">{{
                          link.icon
                        }}</span>
                      </ng-container>
                      <ng-container *ngIf="link.img">
                        <img
                          alt="link-icon"
                          class="img-icon"
                          src="{{ link.img }}"
                        />
                      </ng-container>
                    </a>
                  </ng-container>
                </ng-container>
              </div>
            </td>
          </ng-container>

          <ng-container *ngIf="item.type === 'empty'">
            <td mat-cell *matCellDef="let element">
              <div class="empty">
                <ng-container
                  *ngIf="element.status === 'PENDING' && !element.parentJobID"
                >
                  <app-circular-progress [progress]="0"></app-circular-progress>
                </ng-container>

                <ng-container
                  *ngIf="
                    element.status === 'RUNNING' &&
                    element.completeJobPercentage >= 0 &&
                    !element.parentJobID
                  "
                >
                  <app-circular-progress
                    [progress]="element.completeJobPercentage"
                  ></app-circular-progress>
                </ng-container>
              </div>
            </td>
          </ng-container>

          <ng-container *ngIf="item.type === 'download'">
            <td mat-cell *matCellDef="let element">
              <div class="download" *ngIf="taskRecords$ | async as taskMap">
                <ng-container *ngIf="taskMap[element.id]?.status === 'LOADING'">
                  <mat-spinner diameter="24"></mat-spinner>
                </ng-container>
                <ng-container *ngIf="taskMap[element.id]?.status !== 'LOADING'">
                  <ng-container
                    *ngIf="
                      element.status === 'COMPLETE' &&
                      (taskMap[element.id] === undefined ||
                        taskMap[element.id]?.status === 'IDLE')
                    "
                  >
                    <mat-icon
                      class="material-icon material-icon-base cursor-pointer"
                      (click)="onClickDownloadJob(element.id)"
                      matTooltip="Download"
                      >cloud_download</mat-icon
                    >
                  </ng-container>
                  <ng-container [ngSwitch]="taskMap[element.id]?.status">
                    <mat-icon
                      class="material-icon material-icon-base"
                      *ngSwitchCase="'PENDING'"
                      matTooltip="Pending..."
                      >schedule</mat-icon
                    >
                    <mat-icon
                      class="material-icon material-icon-base"
                      *ngSwitchCase="'DOWNLOADING'"
                      matTooltip="Downloading..."
                      >downloading</mat-icon
                    >
                    <mat-icon
                      class="material-icon material-icon-base"
                      *ngSwitchCase="'ZIPPING'"
                      matTooltip="Zipping..."
                      >folder_zip</mat-icon
                    >
                    <mat-icon
                      class="material-icon material-icon-base"
                      *ngSwitchCase="'UPLOADING'"
                      matTooltip="Uploading..."
                      >upload_file</mat-icon
                    >
                    <mat-icon
                      class="material-icon material-icon-base cursor-pointer"
                      *ngSwitchCase="'COMPLETED'"
                      matTooltip="Completed"
                      (click)="onClickToSaveJob(element.id)"
                      >inventory</mat-icon
                    >
                    <mat-icon
                      class="material-icon material-icon-base cursor-pointer red"
                      (click)="onClickDownloadJob(element.id)"
                      *ngSwitchCase="'FAILED'"
                      matTooltip="Failed. Retry to download"
                      >cloud_download</mat-icon
                    >
                  </ng-container>
                </ng-container>
              </div>
            </td>
          </ng-container>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns" [class.auto-qual-row]="row.autoQual"></tr>
      </table>
    </ng-container>
  </div>
</div>
