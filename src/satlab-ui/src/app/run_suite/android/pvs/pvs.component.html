<div class="w-full flex flex-row justify-between">
  <button
    class="w-full hover:bg-blue-50 text-gray-500 h-12 [&.active]:text-blue-400 [&.active]:border-b [&.active]:border-b-blue-400 text-md"
    [class.active]="tabSignal() === 'storage'"
    (click)="onPropsChanged('tab', 'storage')"
  >
    Storage AVL
  </button>
  <button
    class="w-full hover:bg-blue-50 text-gray-500 h-12 [&.active]:text-blue-400 [&.active]:border-b [&.active]:border-b-blue-400 text-md"
    [class.active]="tabSignal() === 'memory'"
    (click)="onPropsChanged('tab', 'memory')"
  >
    Memory AVL
  </button>
</div>

<div
  class="relative w-full lg:max-w-3xl mx-auto my-[4rem] px-6 pt-0 pb-6 border box-shadow rounded"
>
  <app-loading [loading$]="loading$"></app-loading>
  <div class="min-h-[1.5rem]"></div>
  <div class="flex gap-4 w-full flex-col">
    <app-show-dut
      [isParentLoading]="forceShowDutLoading()"
      [selectorList]="['hostname', 'board', 'model']"
      (valuesChanged)="onDutRelatedValueChanged($event)"
      (dutsChanged)="onDutChanged($event)"
    >
    </app-show-dut>

    <app-provision-form
      [duts]="duts()"
      [board]="boardSignal()"
      [model]="modelSignal()"
      [parentLoading]="isRunLoadingSignal()"
      (provisionFormDataChange)="onPropsChanged('provisionForm', $event)"
      (isLoadingChanged)="onProvisionLoadingChanged($event)"
    ></app-provision-form>

    <app-test-options-card
      [errorMsg]="testOptionsErrorMsg()"
      [loading$]="testOptionsLoading$"
    >
      <app-test-source-picker
        [duts]="duts()"
        [board]="boardSignal()"
        [model]="modelSignal()"
        [parentLoading]="isRunLoadingSignal()"
        [showDriveOption]="false"
        (sourceValuesChanged)="onSourceValuesChanged($event)"
        (isLoadingChanged)="onTestFormLoadingChanged($event)"
        (errorsChanged)="onTestOptionsErrorsChanged($event)"
      ></app-test-source-picker>

      <div class="mt-4">
        <div
          *ngIf="tabSignal() === 'storage'"
          class="flex w-full mb-8 border border-gray-300 rounded-md overflow-hidden"
        >
          <button
            type="button"
            (click)="onStorageAVLTestTypeChanged('runTestplan')"
            [class]="
              storageAVLTestType() === 'runTestplan'
                ? 'flex-1 py-3 px-4 bg-blue-500 text-white font-semibold transition-colors disabled:opacity-50 disabled:cursor-not-allowed'
                : 'flex-1 py-3 px-4 bg-white text-gray-600 font-medium hover:bg-gray-50 transition-colors disabled:opacity-50 disabled:cursor-not-allowed'
            "
          >
            Test Plan
          </button>
          <div class="w-[1px] bg-gray-300"></div>
          <button
            type="button"
            (click)="onStorageAVLTestTypeChanged('runSingleTest')"
            [class]="
              storageAVLTestType() === 'runSingleTest'
                ? 'flex-1 py-3 px-4 bg-blue-500 text-white font-semibold transition-colors disabled:opacity-50 disabled:cursor-not-allowed'
                : 'flex-1 py-3 px-4 bg-white text-gray-600 font-medium hover:bg-gray-50 transition-colors disabled:opacity-50 disabled:cursor-not-allowed'
            "
          >
            Individual Test
          </button>
        </div>
        <div
          *ngIf="
            storageAVLTestType() === 'runSingleTest' &&
            tabSignal() === 'storage'
          "
          class="flex flex-row justify-center w-full"
        >
          <mat-form-field class="w-full">
            <mat-label>Single Test</mat-label>
            <input
              matInput
              (input)="onStorageAVLTestInputValueChanged($event)"
              [value]="storageTestNameSignal()"
              [disabled]="storageAVLTestType() === 'runTestplan'"
            />
          </mat-form-field>
        </div>
      </div>
    </app-test-options-card>

    <div class="advancedSettings">
      <app-settings
        #settingsRef
        [defaultSettings]="this.defaultSettings"
        [customSettings]="settings()"
        (settingsChanged)="onCustomSettingsChanged($event)"
      ></app-settings>
    </div>

    <app-loading-button
      class="mx-auto"
      (onClick)="onRunClicked()"
      [disabled]="!isRunnable()"
      [loading]="isRunLoadingSignal()"
      [text]="'Run'"
    ></app-loading-button>
  </div>
</div>
