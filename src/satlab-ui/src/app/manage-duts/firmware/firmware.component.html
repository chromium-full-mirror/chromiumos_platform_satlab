<div class="wrapper">
  <div class="btn-group">
    <button
      mat-raised-button
      color="primary"
      [disabled]="selection.selected.length === 0 || loading"
      (click)="onUpdateClicked()"
    >
      Update Firmware
    </button>
  </div>

  <div class="duts-wrapper">
    <ng-container *ngIf="loading">
      <div class="loading-overlay">
        <mat-spinner class="spinner"></mat-spinner>
      </div>
    </ng-container>

    <ng-container *ngIf="DUTs.length !== 0">
      <div class="selection-hint-wrapper">
        <p>Selected {{ selectionCount }} of {{ DUTs.length }}</p>
      </div>

      <table mat-table [dataSource]="DUTs">
        <!-- CheckBox -->
        <ng-container matColumnDef="check">
          <th mat-header-cell *matHeaderCellDef>
            <mat-checkbox
              (change)="onCheckboxChanged($event)"
              [(ngModel)]="checked"
              [disabled]="disabled"
            ></mat-checkbox>
          </th>
          <td mat-cell *matCellDef="let element">
            <mat-checkbox
              (change)="onDUTCheckboxChanged(element)"
              [checked]="selection.isSelected(element)"
              [disabled]="element.isLatest"
            >
            </mat-checkbox>
          </td>
        </ng-container>

        <!-- Address Column -->
        <ng-container matColumnDef="ip">
          <th mat-header-cell *matHeaderCellDef>Name</th>
          <td mat-cell *matCellDef="let element">{{ element.address }}</td>
        </ng-container>

        <!-- Current Firmware Column -->
        <ng-container matColumnDef="current">
          <th mat-header-cell *matHeaderCellDef>Current Firmware</th>
          <td mat-cell *matCellDef="let element">
            {{ element.currentFirmware }}
          </td>
        </ng-container>

        <!-- Updater Firmware Column -->
        <ng-container matColumnDef="newest">
          <th mat-header-cell *matHeaderCellDef>Updater Firmware</th>
          <td mat-cell *matCellDef="let element">
            {{ element.newestFirmware }}
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
    </ng-container>
  </div>
</div>
