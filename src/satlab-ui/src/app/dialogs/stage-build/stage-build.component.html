<div class="wrapper">
  <app-loading [loading$]="loading$"></app-loading>

  <div class="content">
    <h2 class="title">Access Test Build</h2>

    <ng-container *ngIf="stageUrl !== ''">
      <div class="message">
        <mat-icon fontIcon="check_circle" class="icon"></mat-icon>
        <p>Successfully staged the test build.</p>
      </div>
    </ng-container>

    <p class="build-link">
      If your DUT does not appear below, request for board access
      <a href="{{ build_access_request_link }}" target="_blank">here</a>
    </p>
    <app-basic-selector
      #boardSelector
      id="boardSelector"
      title="Select Board:"
      placeholder="Please select a board"
      [options]="boardOptions"
      (select)="onBoardChanged($event)"
      [disabled]="boardOptions.length === 0 || (loading | async).show"
    >
    </app-basic-selector>

    <app-basic-selector
      #modelSelector
      id="modelSelector"
      title="Select Model:"
      placeholder="Please select a model"
      [options]="modelOptions"
      (select)="onModelChanged($event)"
      [disabled]="fields.board === '' || (loading | async).show"
    >
    </app-basic-selector>

    <app-build-selector
      [board]="fields.board"
      [model]="fields.model"
      [loading]="loading"
      (onChanged)="onBuildChanged($event)"
    >
    </app-build-selector>
  </div>

  <div class="btn-group">
    <button mat-button mat-dialog-close>Cancel</button>
    <button
      mat-button
      *ngIf="stageUrl === ''"
      (click)="onStageClicked()"
      [disabled]="
        !(
          this.fields.board !== '' &&
          this.fields.model !== '' &&
          this.fields.milestone !== '' &&
          this.fields.build !== ''
        )
      "
    >
      Start
    </button>
    <a mat-button *ngIf="stageUrl !== ''" target="_blank" href="{{ stageUrl }}">
      Go to build bucket
    </a>
  </div>
</div>
