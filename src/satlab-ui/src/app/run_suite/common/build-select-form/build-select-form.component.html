<div class="wrapper">
  <app-loading [loading]="loading"></app-loading>

  <div class="content">
    <app-basic-selector
      #modelSelector
      id="modelSelector"
      title="Select Model:"
      placeholder="Please select a model"
      [options]="modelOptions"
      (select)="onModelChanged($event)"
      [disabled]="modelOptions.length === 0"
    >
    </app-basic-selector>

    <app-basic-selector
      #boardSelector
      id="boardSelector"
      title="Select Board:"
      placeholder="Please select a board"
      [options]="boardOptions"
      (select)="onBoardChanged($event)"
      [disabled]="fields.model === ''"
      [disabledMessage]="fields.model === '' ? 'Please select a model' : ''"
    >
    </app-basic-selector>

    <app-basic-selector
      #milestoneSelector
      id="milestoneSelector"
      title="Select Milestone:"
      placeholder="Please select a milestone"
      [options]="milestoneOptions"
      (select)="onMilestoneChanged($event)"
      [disabled]="!(fields.model !== '' && fields.board != '')"
      [disabledMessage]="
        !(fields.model !== '' && fields.board)
          ? 'Please select a model and board'
          : ''
      "
    >
    </app-basic-selector>

    <app-basic-selector
      #buildSelector
      id="buildSelector"
      title="Select Build Version:"
      placeholder="Please select a build version"
      [options]="buildOptions"
      (select)="onBuildChanged($event)"
      [disabled]="
        !(fields.model !== '' && fields.board != '' && fields.milestone)
      "
      [disabledMessage]="
        !(fields.model !== '' && fields.board !== '' && fields.milestone !== '')
          ? 'Please select a milestone'
          : ''
      "
    >
    </app-basic-selector>

    <app-basic-selector
      #poolSelector
      id="poolSelector"
      title="Select Pool:"
      placeholder="Please select a pool"
      [options]="poolOptions"
      (select)="onPoolChanged($event)"
      [disabled]="fields.model === ''"
      [disabledMessage]="
        fields.model === '' ? 'Please select a model and board' : ''
      "
    >
    </app-basic-selector>
  </div>
</div>
