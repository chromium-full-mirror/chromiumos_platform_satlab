<div class="settings-wrapper">
  <mat-accordion>
    <mat-expansion-panel #settings [hideToggle]="true">
      <mat-expansion-panel-header>
        <mat-panel-title> Advanced settings</mat-panel-title>
        <mat-icon *ngIf="!settings.expanded">arrow_drop_down</mat-icon>
        <mat-icon *ngIf="settings.expanded">arrow_drop_up</mat-icon>
      </mat-expansion-panel-header>
      <div class="flex flex-col gap-4">
        <div>
          <div class="flex flex-row gap-4">
            <mat-slide-toggle
              (change)="onCftChanged($event.checked)"
              [checked]="(settings$ | async).cft && !disabled"
              [disabled]="disabled"
              >CFT execution framework</mat-slide-toggle
            >
          </div>
        </div>

        <div>
          <div class="flex flex-row gap-4">
            <mat-slide-toggle
              (change)="onTrv2Changed($event.checked)"
              [checked]="(settings$ | async).trv2 && !disabled"
              [disabled]="disabled"
              >Test Runner V2</mat-slide-toggle
            >
          </div>
        </div>
      </div>
    </mat-expansion-panel>
  </mat-accordion>
</div>
