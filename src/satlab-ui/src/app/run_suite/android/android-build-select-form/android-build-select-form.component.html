<div class="w-full flex flex-row">
  <button
    (click)="onTabChanged('suite')"
    class="w-full hover:bg-blue-50 text-gray-500 h-12 [&.active]:text-blue-400 [&.active]:border-b [&.active]:border-b-blue-400 text-md"
    [class.active]="tabSignal() === 'suite'"
  >
    Suite
  </button>

  <button
    (click)="onTabChanged('test')"
    class="w-full hover:bg-blue-50 text-gray-500 h-12 [&.active]:text-blue-400 [&.active]:border-b [&.active]:border-b-blue-400 text-md"
    [class.active]="tabSignal() === 'test'"
  >
    Tests
  </button>

  <button
    (click)="onTabChanged('Testplan')"
    class="w-full hover:bg-blue-50 text-gray-500 h-12 [&.active]:text-blue-400 [&.active]:border-b [&.active]:border-b-blue-400 text-md"
    [class.active]="tabSignal() === 'Testplan'"
  >
    Testplan
  </button>
</div>

<div
  class="relative w-full lg:max-w-3xl mx-auto my-[4rem] px-6 pt-0 pb-6 border box-shadow rounded"
>
  <app-loading [loading$]="loading$"></app-loading>
  <div class="min-h-[1.5rem]">
    <p class="text-red-500 text-center" *ngIf="combinedErrorMsg() !== ''">
      {{ combinedErrorMsg() }}
    </p>
  </div>
  <div class="flex gap-2 w-full flex-col">
    <app-basic-selector
      (select)="onPropsChanged('board', $event)"
      [options]="boardOptions()"
      [disabled]="isLoadingSignal() || duts().length === 0"
      title="Select Board:"
    >
    </app-basic-selector>

    <app-basic-selector
      (select)="onPropsChanged('model', $event)"
      [options]="modelsOptions()"
      [value]="modelSignal()"
      [disabled]="isLoadingSignal() || modelsOptions().length === 0"
      title="Select Model (Optional):"
    >
    </app-basic-selector>

    <ng-container *ngIf="!isCrossBranchTestingSignal()">
      <app-basic-selector
        (select)="onPropsChanged('branch', $event)"
        [options]="filteredBranchOptions()"
        [value]="branchSignal()"
        [disabled]="isLoadingSignal() || filteredBranchOptions().length === 0"
        title="Select OS Branch:"
      >
      </app-basic-selector>

      <app-basic-selector
        (select)="onPropsChanged('boardTarget', $event)"
        [options]="boardTargetOptions()"
        [disabled]="isLoadingSignal() || boardTargetOptions().length === 0"
        title="Select OS Target:"
      >
      </app-basic-selector>
    </ng-container>

    <app-android-build-picker
      #provisionPicker
      *ngIf="isCrossBranchTestingSignal()"
      [board]="boardSignal()"
      [model]="modelSignal()"
      [type]="'provision'"
      [duts]="duts()"
      [parentLoading]="isRunLoadingSignal()"
      (loadingWithMsg)="onChildLoadingChanged($event)"
      (dataChanged)="onAndroidBranchTargetBuildChanged($event)"
    ></app-android-build-picker>

    <mat-slide-toggle
      (change)="onCrossBranchTestingChanged($event.checked)"
      [disabled]="isLoadingSignal()"
    >
      Use a separate test build
    </mat-slide-toggle>

    <app-android-build-picker
      #testPicker
      *ngIf="isCrossBranchTestingSignal()"
      [board]="boardSignal()"
      [model]="modelSignal()"
      [type]="'test'"
      [duts]="duts()"
      [buildValidatorConfig]="buildValidator"
      [parentLoading]="isRunLoadingSignal()"
      (loadingWithMsg)="onChildLoadingChanged($event)"
      (dataChanged)="onAndroidBranchTargetBuildChanged($event)"
    ></app-android-build-picker>

    <div *ngIf="!isCrossBranchTestingSignal()">
      <app-basic-selector
        (select)="onPropsChanged('suiteTarget', $event)"
        [options]="suiteTargetOptions()"
        [disabled]="isLoadingSignal() || suiteTargetOptions().length === 0"
        title="Select Test Target:"
      >
      </app-basic-selector>
    </div>

    <app-basic-selector
      (select)="onPropsChanged('pool', $event)"
      [options]="poolsOptions()"
      [disabled]="isLoadingSignal() || poolsOptions().length === 0"
      title="Select Pool:"
    >
    </app-basic-selector>

    <app-autocomplete-selector
      *ngIf="!isCrossBranchTestingSignal()"
      [options]="buildOptions()"
      title="Select Build:"
      (selectChanged)="onPropsChanged('build', $event)"
      (inputValueChanged)="onBuildInputValueChanged($event)"
    ></app-autocomplete-selector>

    <div *ngIf="tabSignal() !== 'Testplan'">
      <app-suite
        [build]="buildForListingSuite()"
        [target]="testTarget()"
        [suite]="suiteSignal()"
        [testTitle]="tabSignal() === 'test' ? 'Test Include:' : 'Test Exclude:'"
        [selectedTestModules]="testModulesSignal()"
        (onSuiteChanged)="onPropsChanged('suite', $event)"
        (onTestModulesChanged)="onPropsChanged('testModules', $event)"
        (onLoadingChanged)="onChildLoadingChanged($event)"
        (onSuiteValidChanged)="onChildSuiteValidChanged($event)"
      >
      </app-suite>
    </div>

    <div *ngIf="tabSignal() === 'Testplan'">
      <app-test-plan
        (changed)="onPlanChanged($event)"
      >
      </app-test-plan>
    </div>

    <div class="advancedSettings">
      <app-settings
        #settingsRef
        [defaultSettings]="
          tabSignal() === 'Testplan' ? this.testplanSettings : this.settings
        "
        [customSettings]="customSettings()"
        (settingsChanged)="onCustomSettingsChanged($event)"
      ></app-settings>
    </div>

    <app-loading-button
      class="mx-auto"
      (onClick)="onRunClicked()"
      [disabled]="!_isRunnable()"
      [loading]="isRunLoadingSignal()"
      [text]="'Run'"
    ></app-loading-button>
  </div>
</div>
