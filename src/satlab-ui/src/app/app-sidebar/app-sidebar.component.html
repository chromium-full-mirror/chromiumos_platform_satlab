<div class="wrapper">
  <mat-toolbar
    #topToolbar
    class="top-bar-wrapper"
    color="primary"
    opened="true"
  >
    <div class="bar-item">
      <button
        (click)="drawer.toggle()"
        aria-label="sidenav button"
        color="accent"
        mat-icon-button
      >
        <mat-icon class="white-color">menu</mat-icon>
      </button>

      <mat-icon class="logo-icon" svgIcon="moblab"></mat-icon>

      <p class="title">Satlab</p>
    </div>
    <div class="bar-item">
      <p
        class="update-info"
        *ngIf="updateService.updateState && !updateService.isLoading"
      >
        New Version Available<span
          class="material-icon warning"
          title="Please reboot to get the latest update."
          >priority_high</span
        >
      </p>
      <p
        class="update-info"
        *ngIf="!updateService.updateState && !updateService.isLoading"
      >
        Up To Date<span class="material-icon safe" title="No new updates."
          >task_alt</span
        >
      </p>
    </div>
  </mat-toolbar>

  <mat-drawer-container autosize>
    <mat-drawer #drawer mode="side" opened="true">
      <div class="sidebar-wrapper">
        <div *ngFor="let tab of navTabs">
          <a routerLink="{{ tab.route }}" routerLinkActive="active-route">
            <div
              [class.disabled]="tab.disabled ?? !(auth.loginState$ | async)"
              class="sidebar-item"
              *ngIf="!tab.children"
            >
              <div class="flex flex-row items-center gap-2">
                <span
                  class="material-icon-base material-icon"
                  [class.material-symbols-outlined]="tab.outlined"
                  >{{ tab.icon }}</span
                >
                <p>{{ tab.label }}</p>
              </div>
            </div>
          </a>

          <ng-container *ngIf="tab.children">
            <button
              class="w-full cursor-pointer"
              (click)="onToggleChildClicked(tab.label)"
            >
              <div
                [class.disabled]="tab.disabled ?? !(auth.loginState$ | async)"
                class="sidebar-item"
              >
                <div class="flex flex-row justify-between gap-6 pr-4">
                  <div class="flex flex-row items-center gap-2">
                    <span
                      class="material-icon-base material-icon"
                      [class.material-symbols-outlined]="tab.outlined"
                      >{{ tab.icon }}</span
                    >
                    <p>{{ tab.label }}</p>
                  </div>
                  <span class="material-icon-base material-icon">{{
                    tab.showChildren
                      ? 'keyboard_arrow_down'
                      : 'keyboard_arrow_right'
                  }}</span>
                </div>
              </div>
            </button>

            <ng-container *ngIf="tab.showChildren">
              <a
                *ngFor="let child of tab.children"
                routerLink="{{ child.route }}"
                routerLinkActive="active-route"
                [routerLinkActiveOptions]="{ exact: true }"
              >
                <div
                  [class.disabled]="
                    child.disabled ?? !(auth.loginState$ | async)
                  "
                  class="sidebar-item"
                >
                  <div class="flex flex-row items-center gap-2 pl-4">
                    <span
                      class="material-icon-base material-icon"
                      [class.material-symbols-outlined]="child.outlined"
                      >{{ child.icon }}</span
                    >
                    <p>{{ child.label }}</p>
                  </div>
                </div>
              </a>
            </ng-container>
          </ng-container>
        </div>
      </div>
    </mat-drawer>

    <div class="content-wrapper">
      <div class="notification-wrapper">
        <app-notification
          (clicked)="dismiss(n)"
          *ngFor="
            let n of this.notificationService.notification$ | async;
            trackBy: trackNotification
          "
          [notification]="n"
        ></app-notification>
      </div>

      <div class="content">
        <router-outlet></router-outlet>
      </div>
    </div>
  </mat-drawer-container>
</div>
